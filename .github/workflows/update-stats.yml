name: Update GitHub stats images

on:
  schedule:
    - cron: '0 6 * * *'   # once a day, 06:00 UTC
  workflow_dispatch:        # lets you trigger it manually too

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats images (only replace files that look valid)
        run: |
          mkdir -p assets
          fetch() {
            url="$1"
            out="$2"
            tmp="$(mktemp)"
            curl -sL "$url" -o "$tmp"
            first_char="$(head -c 1 "$tmp" 2>/dev/null)"
            # Two independent guards: (1) a real SVG/XML response must start with "<" —
            # this catches ANY plain-text error page, known or not, not just the phrases
            # below; (2) an explicit phrase blocklist for text that happens to start with
            # "<" (e.g. an HTML error page) or just to keep the failure reason in the logs.
            if [ -s "$tmp" ] && [ "$first_char" = "<" ] && ! grep -qiE "failed to retrieve|rate limit|something went wrong|error occurred|payment required|deployment_disabled|deployment has been disabled|application error" "$tmp"; then
              cp "$tmp" "assets/$out"
              echo "updated $out"
            else
              echo "skipped $out (fetch looked broken: $(head -c 80 "$tmp" | tr -d '\n'), keeping the existing file)"
            fi
            rm -f "$tmp"
          }

          fetch "https://github-readme-stats.vercel.app/api?username=Hashir9099&show_icons=true&theme=transparent&hide_border=true&bg_color=00000000&title_color=9F8FFF&icon_color=B368F7&text_color=ABA6CE" "github-stats.svg"
          fetch "https://github-readme-stats.vercel.app/api/top-langs/?username=Hashir9099&layout=compact&theme=transparent&hide_border=true&bg_color=00000000&title_color=9F8FFF&text_color=ABA6CE" "top-langs.svg"
          fetch "https://streak-stats.demolab.com/?user=Hashir9099&theme=transparent&hide_border=true&background=00000000&ring=7C6CF6&fire=B368F7&currStreakLabel=EEECFB&sideLabels=ABA6CE&sideNums=EEECFB&currStreakNum=EEECFB&dates=6E6893" "streak-stats.svg"
          fetch "https://github-readme-activity-graph.vercel.app/graph?username=Hashir9099&theme=react-dark&hide_border=true&bg_color=00000000&color=ABA6CE&line=7C6CF6&point=B368F7" "activity-graph.svg"
          fetch "https://github-profile-trophy.vercel.app/?username=Hashir9099&theme=discord&no-frame=true&column=4&margin-w=8&margin-h=8" "trophies.svg"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh GitHub stats images"
          git push
